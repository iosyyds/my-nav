<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的导航</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23007aff'/><text x='50' y='68' font-size='50' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>N</text></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f3f4f6;--card:#fff;--text:#1a1a1a;--ts:#9ca3af;--blue:#007aff;--border:#e5e7eb;--shadow:0 1px 3px rgba(0,0,0,.05)}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
.header{background:rgba(255,255,255,.85);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);position:sticky;top:0;z-index:100;border-bottom:1px solid var(--border)}
.header-inner{max-width:1100px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px}
.logo{font-size:20px;font-weight:800;white-space:nowrap;letter-spacing:-.5px}
.logo span{color:var(--blue)}
.search-wrap{flex:1;max-width:500px;display:flex;gap:8px;align-items:center}
.search-bar{flex:1;display:flex;align-items:center;background:var(--bg);border-radius:10px;padding:8px 14px;transition:box-shadow .2s}
.search-bar:focus-within{box-shadow:0 0 0 3px rgba(0,122,255,.15);background:#fff}
.search-bar svg{width:16px;height:16px;color:var(--ts);margin-right:8px;flex-shrink:0}
.search-bar input{border:none;outline:none;flex:1;font-size:14px;background:transparent}
.search-btn{padding:8px 18px;border-radius:10px;background:var(--blue);color:#fff;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
.search-btn:hover{background:#0056b3;transform:scale(1.02)}
.engines{display:flex;border-radius:10px;overflow:hidden;border:1px solid var(--border)}
.engine-btn{padding:8px 10px;font-size:12px;cursor:pointer;border:none;background:#fff;color:var(--ts);transition:all .15s}
.engine-btn.active{background:var(--blue);color:#fff}
.container{max-width:1100px;margin:0 auto;padding:20px}
.cat-guide{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:24px}
.cat-card{background:var(--card);border-radius:14px;padding:16px;box-shadow:var(--shadow);cursor:pointer;transition:all .25s cubic-bezier(.4,0,.2,1);border:1px solid var(--border);position:relative;overflow:hidden}
.cat-card:hover{box-shadow:0 8px 24px rgba(0,0,0,.1);transform:translateY(-3px)}
.cat-card:active{transform:translateY(-1px) scale(.98)}
.cat-card-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;font-size:17px;font-weight:800;color:#fff}
.cat-card-name{font-size:14px;font-weight:700;margin-bottom:3px}
.cat-card-desc{font-size:11px;color:var(--ts);line-height:1.4}
.cat-card-count{font-size:10px;color:#d1d5db;margin-top:6px;font-weight:500}
.section{background:var(--card);border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:16px;overflow:hidden;animation:fadeUp .4s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.section-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 4px}
.section-title{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.section-title .dot{width:8px;height:8px;border-radius:50%}
.section-count{font-size:12px;color:var(--ts)}
.site-list{padding:8px 16px 12px;display:grid;grid-template-columns:repeat(2,1fr);gap:0 20px}
.site-item{display:flex;align-items:center;gap:12px;padding:9px 8px;border-radius:10px;transition:all .15s;cursor:pointer}
.site-item:hover{background:#f3f4f6}
.site-item:active{background:#e5e7eb}
.site-favicon{width:36px;height:36px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#f3f4f6}
.site-favicon img{width:100%;height:100%;object-fit:contain}
.site-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:800;border-radius:8px}
.site-info{min-width:0;flex:1}
.site-name{font-size:14px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.site-url{font-size:11px;color:var(--ts);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.site-name mark{background:rgba(0,122,255,.12);color:var(--blue);border-radius:2px;padding:0 2px}
.load-more{text-align:center;padding:14px;border-top:1px solid var(--border);cursor:pointer;color:var(--blue);font-size:14px;font-weight:600;transition:all .2s;user-select:none}
.load-more:hover{background:#f0f7ff;color:#0056b3}
.load-more:active{background:#e0efff}
.empty{text-align:center;padding:60px 20px;color:var(--ts)}
.footer{text-align:center;padding:30px;color:#d1d5db;font-size:12px}
@media(max-width:640px){.header-inner{flex-wrap:wrap;gap:10px}.cat-guide{grid-template-columns:repeat(2,1fr);gap:8px}.site-list{grid-template-columns:1fr}.cat-card{padding:12px}}
</style>
</head>
<body>
<div class="header"><div class="header-inner">
<div class="logo">我的<span>导航</span></div>
<div class="search-wrap">
<div class="search-bar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input id="searchInput" placeholder="搜索书签或网址…" autofocus></div>
<button class="search-btn" onclick="doSearch()">搜索</button>
</div>
<div class="engines"><button class="engine-btn active" data-e="baidu">百度</button><button class="engine-btn" data-e="google">Google</button><button class="engine-btn" data-e="bing">必应</button></div>
</div></div>
<div class="container">
<div class="cat-guide" id="catGuide"></div>
<div id="sections"><div class="empty">加载中…</div></div>
</div>
<div class="footer" id="footer"></div>
<script>
var PALETTES=[["#007aff","#5ac8fa"],["#af52de","#ff2d55"],["#ff9500","#ffcc00"],["#34c759","#30d158"],["#ff3b30","#ff6b6b"],["#5856d6","#5e5ce6"],["#00c7be","#64d2ff"],["#ff2d55","#ff375f"],["#bfaf9e","#d2c4b5"],["#8e8e93","#aeaeb2"],["#1d1d1f","#3a3a3c"],["#64d2ff","#007aff"]];
var CAT_INFO={"开发 / 站长":{desc:"程序员必备工具",color:"#007aff"},"iOS / 苹果":{desc:"苹果生态资源",color:"#ff2d55"},"设计 / 素材":{desc:"设计师灵感素材",color:"#ff9500"},"机场 / 网络":{desc:"网络工具推荐",color:"#34c759"},"其他":{desc:"实用网站收藏",color:"#8e8e93"},"网盘 / 资源":{desc:"网盘搜索下载",color:"#00c7be"},"AI 工具":{desc:"AI智能工具大全",color:"#af52de"},"游戏":{desc:"游戏相关网站",color:"#ff3b30"}};
var ENGINES={baidu:"https://www.baidu.com/s?wd=",google:"https://www.google.com/search?q=",bing:"https://www.bing.com/search?q="};
var PAGE_SIZE=12;
var GROUPS=null,currentEngine="baidu",searchQuery="";
var pageState={};
function hashStr(s){var h=0;for(var i=0;i<s.length;i++)h=((h<<5)-h+s.charCodeAt(i))|0;return Math.abs(h)}
function faviconHTML(domain){var h=hashStr(domain);var p=PALETTES[h%PALETTES.length];var letter=domain.charAt(0).toUpperCase();return '<div class="site-favicon"><img src="https://'+domain+'/favicon.ico" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'"><div class="site-fallback" style="display:none;background:linear-gradient(135deg,'+p[0]+','+p[1]+')">'+letter+'</div></div>'}
function highlight(text,q){if(!q)return text;var idx=text.toLowerCase().indexOf(q.toLowerCase());if(idx===-1)return text;return text.slice(0,idx)+'<mark>'+text.slice(idx,idx+q.length)+'</mark>'+text.slice(idx+q.length)}
function renderGuide(){document.getElementById("catGuide").innerHTML=GROUPS.map(function(g){var info=CAT_INFO[g.name]||{desc:"",color:"#8e8e93"};return '<div class="cat-card" onclick="jumpTo(\''+g.name+'\')"><div class="cat-card-icon" style="background:linear-gradient(135deg,'+info.color+','+info.color+'cc)">'+g.name.charAt(0)+'</div><div class="cat-card-name">'+g.name+'</div><div class="cat-card-desc">'+info.desc+'</div><div class="cat-card-count">'+g.items.length+' 个网站</div></div>'}).join('')}
function jumpTo(name){var el=document.getElementById("sec-"+name.replace(/\s|\//g,"-"));if(el)el.scrollIntoView({behavior:"smooth",block:"start"})}
function getFilteredItems(g){if(!searchQuery)return g.items;var q=searchQuery.toLowerCase();return g.items.filter(function(i){return i.name.toLowerCase().indexOf(q)!==-1||i.domain.indexOf(q)!==-1||i.url.indexOf(q)!==-1})}
function renderSections(){var container=document.getElementById("sections");var total=0;var html=GROUPS.map(function(g){var items=getFilteredItems(g);if(items.length===0)return '';total+=items.length;var info=CAT_INFO[g.name]||{color:"#8e8e93"};var shown=pageState[g.name]||PAGE_SIZE;if(searchQuery)shown=items.length;var visible=items.slice(0,shown);var id="sec-"+g.name.replace(/\s|\//g,"-");return '<div class="section" id="'+id+'"><div class="section-head"><div class="section-title"><span class="dot" style="background:'+info.color+'"></span>'+g.name+'</div><div class="section-count">'+items.length+' 个网站</div></div><div class="site-list">'+visible.map(function(i){return '<a class="site-item" href="'+i.url+'" target="_blank" rel="noopener">'+faviconHTML(i.domain)+'<div class="site-info"><div class="site-name">'+highlight(i.name,searchQuery)+'</div><div class="site-url">'+i.domain+'</div></div></a>'}).join('')+'</div>'+(items.length>shown?'<div class="load-more" onclick="loadMore(\''+g.name+'\')">加载更多 ('+(items.length-shown)+')</div>':'')+'</div>'}).join('');container.innerHTML=html||'<div class="empty">没有找到「'+searchQuery+'」</div>';document.getElementById("footer").textContent="共 "+total+" 个书签"}
function loadMore(name){pageState[name]=(pageState[name]||PAGE_SIZE)+PAGE_SIZE;renderSections()}
function doSearch(){if(searchQuery)window.open(ENGINES[currentEngine]+encodeURIComponent(searchQuery),"_blank")}
function loadData(){var urls=['https://cdn.jsdelivr.net/gh/iosyyds/my-nav@main/src/app/bookmarks.ts','https://fastly.jsdelivr.net/gh/iosyyds/my-nav@main/src/app/bookmarks.ts','https://raw.githubusercontent.com/iosyyds/my-nav/main/src/app/bookmarks.ts'];function tryNext(i){if(i>=urls.length){document.getElementById("sections").innerHTML='<div class="empty">数据加载失败，请刷新重试</div>';return}fetch(urls[i]).then(function(r){return r.text()}).then(function(txt){var eqIdx=txt.indexOf('= [');if(eqIdx===-1)throw new Error('parse');var bracketStart=eqIdx+2;var depth=0,end=-1,inStr=false,strCh='';for(var j=bracketStart;j<txt.length;j++){var c=txt[j];if(inStr){if(c===strCh&&txt[j-1]!=='\\')inStr=false;continue}if(c==='"'||c==="'"||c==='`'){inStr=true;strCh=c;continue}if(c==='[')depth++;if(c===']'){depth--;if(depth===0){end=j;break}}}var arrStr=txt.slice(bracketStart,end+1);GROUPS=new Function('return '+arrStr)();renderGuide();renderSections()}).catch(function(){tryNext(i+1)})}tryNext(0)}
document.getElementById("searchInput").addEventListener("input",function(e){searchQuery=e.target.value;if(GROUPS)renderSections()});
document.getElementById("searchInput").addEventListener("keydown",function(e){if(e.key==="Enter")doSearch()});
document.querySelectorAll(".engine-btn").forEach(function(b){b.addEventListener("click",function(){document.querySelectorAll(".engine-btn").forEach(function(x){x.classList.remove("active")});b.classList.add("active");currentEngine=b.dataset.e})});
loadData();
</script>
</body>
</html>
