<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>我的导航</title>
<style>
:root {
  --theme-color: #f1404b;
  --hover-color: #d12768;
  --body-bg-color: #f2f4f7;
  --main-bg-color: #ffffff;
  --main-radius: 12px;
  --main-nav-height: 80px;
  --main-max-width: 1260px;
  --main-blur-bg-color: rgba(255,255,255,.75);
  --theme-border-radius: 25px;
  --theme-border-radius-md: 8px;
  --muted-bg-color: #f5f6f8;
  --muted-shadow: rgba(0,0,0,.06);
  --text-color: #333;
  --text-muted: #999;
}
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--body-bg-color);
  color: var(--text-color);
  line-height: 1.6;
  min-height: 100vh;
}
a { text-decoration:none; color:inherit; }
img { display:block; max-width:100%; }
.site-header {
  position: fixed; top:0; left:0; right:0; z-index:1000;
  height: var(--main-nav-height);
  background: var(--main-blur-bg-color);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid rgba(0,0,0,.05);
  transition: box-shadow .3s;
}
.site-header.scrolled { box-shadow: 0 2px 20px rgba(0,0,0,.08); }
.header-inner {
  max-width: var(--main-max-width);
  margin: 0 auto;
  height: 100%;
  padding: 0 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.navbar-logo {
  display: flex; align-items: center; gap: 10px;
  font-size: 20px; font-weight: 700; color: var(--theme-color);
}
.navbar-logo .logo-icon {
  width: 36px; height: 36px; border-radius: 50%;
  background: linear-gradient(135deg, #f1404b, #ff8c42, #c44dff);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 14px; font-weight: 800;
}
.header-nav-menu { display:flex; gap: 8px; list-style:none; }
.header-nav-menu a {
  padding: 8px 16px; border-radius: 20px; font-size: 14px;
  color: #555; transition: all .25s;
}
.header-nav-menu a:hover { background: rgba(241,64,75,.08); color: var(--theme-color); }
.header-search-toggle {
  width: 38px; height: 38px; border-radius: 50%;
  border: none; background: rgba(0,0,0,.05);
  cursor: pointer; display:flex; align-items:center; justify-content:center;
  font-size: 16px; transition: all .25s;
}
.header-search-toggle:hover { background: var(--theme-color); color:#fff; }
.header-banner {
  position: relative;
  padding-top: var(--main-nav-height);
  overflow: hidden;
  min-height: 340px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.blob {
  position: absolute; border-radius: 50%;
  opacity: .85;
  pointer-events: none;
}
.blob-1 {
  width: 600px; height: 600px;
  background: linear-gradient(135deg, #f1404b, #ff6b4a);
  top: -200px; left: -100px;
}
.blob-2 {
  width: 500px; height: 500px;
  background: linear-gradient(135deg, #ff8c42, #ffb347);
  top: -100px; right: -80px;
}
.blob-3 {
  width: 450px; height: 450px;
  background: linear-gradient(135deg, #c44dff, #e040fb);
  bottom: -150px; right: 15%;
}
.blob-4 {
  width: 400px; height: 400px;
  background: linear-gradient(135deg, #f1404b, #e91e63);
  bottom: -100px; left: 10%;
  opacity: .7;
}
.big-search-wrap {
  position: relative; z-index: 2;
  max-width: 800px; width: 100%;
  padding: 40px 20px;
  text-align: center;
}
.hero-logo {
  width: 90px; height: 90px; margin: 0 auto 20px;
  border-radius: 50%;
  background: linear-gradient(135deg, #f1404b 0%, #ff8c42 50%, #c44dff 100%);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 36px; font-weight: 800;
  box-shadow: 0 8px 32px rgba(241,64,75,.3);
}
.hero-title {
  font-size: 28px; font-weight: 800; color: #fff;
  margin-bottom: 24px; letter-spacing: 4px;
  text-shadow: 0 2px 20px rgba(0,0,0,.2);
}
.search-form {
  position: relative;
  max-width: 640px;
  margin: 0 auto;
}
.search-input {
  width: 100%;
  height: 52px;
  border: none; outline: none;
  border-radius: var(--theme-border-radius);
  padding: 0 60px 0 24px;
  font-size: 16px;
  background: rgba(40,30,40,.55);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  color: #fff;
  box-shadow: 0 8px 32px rgba(0,0,0,.15);
  transition: background .3s, box-shadow .3s;
}
.search-input::placeholder { color: rgba(255,255,255,.6); }
.search-input:focus {
  background: rgba(40,30,40,.7);
  box-shadow: 0 8px 40px rgba(0,0,0,.25);
}
.search-btn {
  position: absolute; right: 6px; top: 50%;
  transform: translateY(-50%);
  width: 40px; height: 40px;
  border: none; border-radius: 50%;
  background: transparent; color: #fff;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .25s;
}
.search-btn:hover { background: rgba(255,255,255,.15); }
.search-engines {
  display: flex; justify-content: center; gap: 10px;
  margin-top: 16px;
}
.engine-btn {
  padding: 6px 20px;
  border: none; border-radius: 20px;
  background: rgba(255,255,255,.25);
  backdrop-filter: blur(8px);
  color: #fff; font-size: 13px; cursor: pointer;
  transition: all .25s;
}
.engine-btn.active {
  background: #fff;
  color: var(--theme-color);
  font-weight: 600;
}
.engine-btn:hover { background: rgba(255,255,255,.4); }
.engine-btn.active:hover { background: #fff; }
.category-nav {
  position: sticky; top: var(--main-nav-height); z-index: 100;
  background: var(--main-blur-bg-color);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid rgba(0,0,0,.05);
  padding: 12px 0;
}
.category-nav-inner {
  max-width: var(--main-max-width);
  margin: 0 auto; padding: 0 20px;
  display: flex; gap: 8px; overflow-x: auto;
  scrollbar-width: none;
}
.category-nav-inner::-webkit-scrollbar { display:none; }
.cat-pill {
  flex-shrink: 0;
  padding: 7px 18px;
  border-radius: 20px;
  font-size: 14px;
  background: var(--muted-bg-color);
  color: #555;
  cursor: pointer;
  transition: all .25s;
  border: none;
  white-space: nowrap;
}
.cat-pill:hover { background: rgba(241,64,75,.1); color: var(--theme-color); }
.cat-pill.active {
  background: var(--theme-color);
  color: #fff;
  font-weight: 600;
  box-shadow: 0 4px 12px rgba(241,64,75,.3);
}
.main-content {
  max-width: var(--main-max-width);
  margin: 0 auto;
  padding: 24px 20px 60px;
}
.book-card {
  background: var(--main-bg-color);
  border-radius: var(--main-radius);
  margin-bottom: 20px;
  box-shadow: 0 1px 3px var(--muted-shadow);
  overflow: hidden;
  transition: box-shadow .3s;
}
.book-card:hover {
  box-shadow: 0 4px 20px var(--muted-shadow);
}
.card-header {
  display: flex; align-items: center;
  padding: 16px 20px;
  border-bottom: 1px solid rgba(0,0,0,.04);
  position: relative;
}
.card-header::before {
  content: "";
  position: absolute; left: 0; top: 50%;
  transform: translateY(-50%);
  width: 4px; height: 20px;
  background: var(--theme-color);
  border-radius: 0 4px 4px 0;
}
.card-title {
  font-size: 16px; font-weight: 700;
  margin-left: 8px;
}
.card-count {
  margin-left: auto;
  font-size: 12px; color: var(--text-muted);
}
.card-body {
  padding: 12px 16px;
}
.book-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 4px;
}
.book-link {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px;
  border-radius: var(--theme-border-radius-md);
  transition: background .2s, transform .2s;
  cursor: pointer;
}
.book-link:hover {
  background: var(--muted-bg-color);
  transform: translateY(-1px);
}
.book-favicon {
  width: 28px; height: 28px;
  border-radius: 6px;
  flex-shrink: 0;
  background: var(--muted-bg-color);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.book-favicon img {
  width: 100%; height: 100%;
  object-fit: cover;
}
.book-favicon .favicon-fallback {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; color: #fff;
}
.book-name {
  font-size: 13px; color: #444;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  flex: 1;
}
.book-link:hover .book-name { color: var(--theme-color); }
.loading-state, .empty-state {
  text-align: center; padding: 80px 20px;
  color: var(--text-muted); font-size: 15px;
}
.site-footer {
  text-align: center; padding: 30px 20px;
  color: var(--text-muted); font-size: 13px;
}
@media (max-width: 768px) {
  .header-nav-menu { display: none; }
  .hero-title { font-size: 22px; letter-spacing: 2px; }
  .hero-logo { width: 70px; height: 70px; font-size: 28px; }
  .header-banner { min-height: 260px; }
  .book-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .search-input { height: 48px; font-size: 15px; }
}
@media (max-width: 480px) {
  .book-grid { grid-template-columns: 1fr 1fr; }
  .blob-2, .blob-3 { display: none; }
}
</style>
</head>
<body>
<header class="site-header" id="siteHeader">
  <div class="header-inner">
    <a href="/" class="navbar-logo">
      <div class="logo-icon">io</div>
      <span>我的导航</span>
    </a>
    <nav>
      <ul class="header-nav-menu">
        <li><a href="#">首页</a></li>
        <li><a href="#">分类</a></li>
        <li><a href="#">关于</a></li>
      </ul>
    </nav>
    <button class="header-search-toggle" onclick="document.getElementById('searchInput').focus()" aria-label="搜索"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></button>
  </div>
</header>
<section class="header-banner">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="blob blob-4"></div>
  <div class="big-search-wrap">
    <div class="hero-logo">io</div>
    <div class="hero-title">ONE NAV</div>
    <div class="search-form">
      <input type="text" class="search-input" id="searchInput" placeholder="搜索书签或网址..." autocomplete="off">
      <button class="search-btn" onclick="doSearch()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      </button>
    </div>
    <div class="search-engines" id="engineBtns">
      <button class="engine-btn active" data-engine="baidu">百度</button>
      <button class="engine-btn" data-engine="google">Google</button>
      <button class="engine-btn" data-engine="bing">必应</button>
    </div>
  </div>
</section>
<nav class="category-nav">
  <div class="category-nav-inner" id="categoryNav">
    <button class="cat-pill active" data-cat="all">全部</button>
  </div>
</nav>
<main class="main-content" id="mainContent">
  <div class="loading-state">加载中...</div>
</main>
<footer class="site-footer">
  <p>我的导航 · 共 <span id="totalCount">0</span> 个书签</p>
</footer>
<script>
var CDN_URLS = [
  'https://cdn.jsdelivr.net/gh/iosyyds/my-nav@main/src/app/bookmarks.ts',
  'https://fastly.jsdelivr.net/gh/iosyyds/my-nav@main/src/app/bookmarks.ts',
  'https://raw.githubusercontent.com/iosyyds/my-nav/main/src/app/bookmarks.ts'
];
var allGroups = [];
var currentCat = 'all';
var searchQuery = '';
var currentEngine = 'baidu';
var ENGINE_URLS = {
  baidu: 'https://www.baidu.com/s?wd=',
  google: 'https://www.google.com/search?q=',
  bing: 'https://www.bing.com/search?q='
};
async function loadBookmarks() {
  for (var i = 0; i < CDN_URLS.length; i++) {
    try {
      var resp = await fetch(CDN_URLS[i]);
      if (!resp.ok) continue;
      var text = await resp.text();
      var startIdx = text.indexOf('= [');
      if (startIdx === -1) continue;
      var depth = 0, endIdx = -1;
      for (var j = startIdx + 2; j < text.length; j++) {
        if (text[j] === '[') depth++;
        if (text[j] === ']') { depth--; if (depth === 0) { endIdx = j; break; } }
      }
      if (endIdx === -1) continue;
      var arrStr = text.slice(startIdx + 3, endIdx);
      allGroups = new Function('return [' + arrStr + ']')();
      render();
      return;
    } catch(e) { console.warn('CDN failed:', CDN_URLS[i], e); }
  }
  document.getElementById('mainContent').innerHTML = '<div class="empty-state">数据加载失败，请刷新重试</div>';
}
var FALLBACK_COLORS = ['#f1404b','#ff8c42','#c44dff','#42a5f5','#66bb6a','#ffa726','#ec407a','#5c6bc0'];
function getFallbackColor(name) {
  var hash = 0;
  for (var i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  return FALLBACK_COLORS[Math.abs(hash) % FALLBACK_COLORS.length];
}
function faviconHTML(item) {
  var initial = (item.name || item.domain || '?').charAt(0).toUpperCase();
  var color = getFallbackColor(item.domain || item.name);
  var favUrl = 'https://' + item.domain + '/favicon.ico';
  return '<div class="book-favicon">' +
    '<img src="' + favUrl + '" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">' +
    '<div class="favicon-fallback" style="display:none;background:' + color + '">' + initial + '</div>' +
  '</div>';
}
function render() {
  var catNav = document.getElementById('categoryNav');
  var catHTML = '<button class="cat-pill' + (currentCat==='all'?' active':'') + '" data-cat="all">全部</button>';
  allGroups.forEach(function(g) {
    var shortName = g.name.split('/')[0].trim();
    catHTML += '<button class="cat-pill' + (currentCat===g.name?' active':'') + '" data-cat="' + g.name + '">' + shortName + '</button>';
  });
  catNav.innerHTML = catHTML;
  catNav.querySelectorAll('.cat-pill').forEach(function(btn) {
    btn.addEventListener('click', function() {
      currentCat = btn.dataset.cat;
      render();
      document.getElementById('mainContent').scrollIntoView({behavior:'smooth'});
    });
  });
  var groups = allGroups;
  if (currentCat !== 'all') groups = groups.filter(function(g) { return g.name === currentCat; });
  if (searchQuery) {
    groups = groups.map(function(g) {
      return {
        name: g.name,
        items: g.items.filter(function(it) {
          return it.name.toLowerCase().indexOf(searchQuery) !== -1 ||
                 it.url.toLowerCase().indexOf(searchQuery) !== -1 ||
                 it.domain.toLowerCase().indexOf(searchQuery) !== -1;
        })
      };
    }).filter(function(g) { return g.items.length > 0; });
  }
  var main = document.getElementById('mainContent');
  var totalItems = 0;
  groups.forEach(function(g) { totalItems += g.items.length; });
  document.getElementById('totalCount').textContent = totalItems;
  if (groups.length === 0 || totalItems === 0) {
    main.innerHTML = '<div class="empty-state">没有找到匹配的书签</div>';
    return;
  }
  var html = '';
  groups.forEach(function(g) {
    html += '<div class="book-card">' +
      '<div class="card-header"><div class="card-title">' + g.name + '</div>' +
      '<div class="card-count">' + g.items.length + ' 个</div></div>' +
      '<div class="card-body"><div class="book-grid">' +
      g.items.map(function(it) {
        return '<a class="book-link" href="' + it.url + '" target="_blank" rel="noopener">' +
          faviconHTML(it) +
          '<span class="book-name" title="' + it.name + '">' + it.name + '</span></a>';
      }).join('') +
      '</div></div></div>';
  });
  main.innerHTML = html;
}
function doSearch() {
  var q = document.getElementById('searchInput').value.trim();
  if (!q) { searchQuery = ''; render(); return; }
  searchQuery = q.toLowerCase();
  render();
}
document.getElementById('searchInput').addEventListener('input', function(e) {
  searchQuery = e.target.value.trim().toLowerCase();
  if (allGroups.length) render();
});
document.getElementById('searchInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    var q = e.target.value.trim();
    if (!q) return;
    var hasMatch = false;
    for (var i = 0; i < allGroups.length; i++) {
      for (var j = 0; j < allGroups[i].items.length; j++) {
        var it = allGroups[i].items[j];
        if (it.name.toLowerCase().indexOf(q.toLowerCase()) !== -1 ||
            it.url.toLowerCase().indexOf(q.toLowerCase()) !== -1) {
          hasMatch = true; break;
        }
      }
      if (hasMatch) break;
    }
    if (!hasMatch) {
      window.open(ENGINE_URLS[currentEngine] + encodeURIComponent(q), '_blank');
    }
  }
});
document.getElementById('engineBtns').addEventListener('click', function(e) {
  var btn = e.target.closest('.engine-btn');
  if (!btn) return;
  document.querySelectorAll('.engine-btn').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  currentEngine = btn.dataset.engine;
});
window.addEventListener('scroll', function() {
  document.getElementById('siteHeader').classList.toggle('scrolled', window.scrollY > 10);
});
loadBookmarks();
</script>
</body>
</html>
