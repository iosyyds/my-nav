<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>我的导航</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23f1404b'/><text x='50' y='68' font-size='40' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>io</text></svg>">
<style>
:root{--theme:#f1404b;--theme-dark:#d12768;--bg:#f2f4f7;--card:#fff;--radius:12px;--nav-h:76px;--maxw:1200px;--blur:rgba(255,255,255,.82);--pill:28px;--muted:#999}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:#333;min-height:100vh;-webkit-font-smoothing:antialiased;line-height:1.5}
a{text-decoration:none;color:inherit}
img{display:block;max-width:100%}
.topnav{position:fixed;top:0;left:0;right:0;z-index:1000;height:var(--nav-h);background:var(--blur);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(0,0,0,.04);transition:box-shadow .3s}
.topnav.scrolled{box-shadow:0 2px 24px rgba(0,0,0,.08)}
.topnav-in{max-width:var(--maxw);margin:0 auto;height:100%;padding:0 24px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.brand-badge{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#f1404b,#e91e63);display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:800;font-style:italic;box-shadow:0 2px 8px rgba(241,64,75,.35)}
.brand-name{font-size:19px;font-weight:700;color:var(--theme)}
.menu{display:flex;gap:2px;list-style:none}
.menu button{padding:8px 20px;border-radius:20px;font-size:14px;color:#555;background:none;border:none;cursor:pointer;font-family:inherit;transition:all .25s}
.menu button:hover,.menu button.active{background:rgba(241,64,75,.1);color:var(--theme)}
.icon-btn{width:38px;height:38px;border-radius:50%;border:none;background:rgba(0,0,0,.05);cursor:pointer;display:flex;align-items:center;justify-content:center;color:#555;transition:all .25s}
.icon-btn:hover{background:var(--theme);color:#fff}
.hero{position:relative;padding-top:var(--nav-h);min-height:420px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff}
.blob{position:absolute;pointer-events:none}
.blob-tl{width:480px;height:320px;background:linear-gradient(135deg,#f1404b,#ff6b4a);top:-60px;left:-120px;border-radius:0 0 80% 0;opacity:.9}
.blob-tl2{width:380px;height:280px;background:linear-gradient(135deg,#ff9500,#ffb347);top:-40px;left:80px;border-radius:0 0 60% 20%;opacity:.7}
.blob-tr{width:520px;height:360px;background:linear-gradient(135deg,#e040fb,#c44dff);top:-40px;right:-140px;border-radius:0 0 0 80%;opacity:.85}
.blob-br{width:700px;height:280px;background:linear-gradient(135deg,#f1404b,#e91e63);bottom:-40px;right:-80px;border-radius:80% 0 0 0;opacity:.7}
.blob-bl{width:300px;height:240px;background:linear-gradient(135deg,#ff9500,#ffb347);bottom:-60px;left:-60px;border-radius:0 80% 0 0;opacity:.6}
.hero-in{position:relative;z-index:2;text-align:center;padding:50px 20px;max-width:680px;width:100%}
.hero-logo{width:100px;height:100px;margin:0 auto 18px;border-radius:50%;background:linear-gradient(135deg,#f1404b,#e91e63);display:flex;align-items:center;justify-content:center;box-shadow:0 12px 40px rgba(241,64,75,.35);position:relative}
.hero-logo::before{content:"";position:absolute;inset:-10px;border-radius:50%;background:conic-gradient(from 0deg,#f1404b,#ff9500,#e040fb,#f1404b);opacity:.25;z-index:-1;filter:blur(12px)}
.hero-logo span{color:#fff;font-size:40px;font-weight:800;font-style:italic;letter-spacing:-3px;line-height:1}
.hero-title{font-size:30px;font-weight:800;color:var(--theme);letter-spacing:8px;margin-bottom:30px}
.searchbox{position:relative;max-width:580px;margin:0 auto}
.searchbox input{width:100%;height:58px;border:none;outline:none;border-radius:var(--pill);padding:0 64px 0 28px;font-size:17px;background:linear-gradient(90deg,rgba(80,60,70,.55),rgba(60,20,30,.65));backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:#fff;box-shadow:0 10px 36px rgba(0,0,0,.18);transition:all .3s}
.searchbox input::placeholder{color:rgba(255,255,255,.6)}
.searchbox input:focus{box-shadow:0 10px 44px rgba(0,0,0,.28);background:linear-gradient(90deg,rgba(80,60,70,.65),rgba(60,20,30,.75))}
.searchbox .go{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:none;border-radius:50%;background:transparent;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}
.searchbox .go:hover{background:rgba(255,255,255,.15)}
.engines{display:flex;justify-content:center;gap:14px;margin-top:22px}
.eng-btn{padding:8px 26px;border:none;border-radius:20px;background:rgba(255,255,255,.4);backdrop-filter:blur(8px);color:#666;font-size:14px;cursor:pointer;transition:all .25s}
.eng-btn.active{background:#fff;color:var(--theme);font-weight:600;box-shadow:0 2px 12px rgba(0,0,0,.1)}
.eng-btn:hover{background:rgba(255,255,255,.6);color:#333}
.eng-btn.active:hover{background:#fff;color:var(--theme)}
.catbar{position:sticky;top:var(--nav-h);z-index:100;background:var(--blur);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(0,0,0,.04);padding:14px 0}
.catbar-in{max-width:var(--maxw);margin:0 auto;padding:0 24px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.catbar-in::-webkit-scrollbar{display:none}
.cat{flex-shrink:0;padding:8px 20px;border-radius:20px;font-size:14px;background:#f5f6f8;color:#555;cursor:pointer;transition:all .25s;border:none;white-space:nowrap}
.cat:hover{background:rgba(241,64,75,.1);color:var(--theme)}
.cat.active{background:var(--theme);color:#fff;font-weight:600;box-shadow:0 4px 14px rgba(241,64,75,.3)}
.content{max-width:var(--maxw);margin:0 auto;padding:28px 24px 60px}
.card{background:var(--card);border-radius:var(--radius);margin-bottom:18px;box-shadow:0 1px 4px rgba(0,0,0,.04);overflow:hidden;transition:box-shadow .3s}
.card:hover{box-shadow:0 6px 24px rgba(0,0,0,.08)}
.card-h{display:flex;align-items:center;padding:18px 20px 10px;position:relative}
.card-h::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:4px;height:22px;background:linear-gradient(180deg,#f1404b,#e91e63);border-radius:0 4px 4px 0}
.card-h h3{font-size:16px;font-weight:700;margin-left:10px}
.card-h .n{margin-left:auto;font-size:12px;color:var(--muted)}
.card-b{padding:6px 14px 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:2px}
.item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;transition:all .2s;cursor:pointer}
.item:hover{background:#f7f8fa;transform:translateY(-1px)}
.item:hover .nm{color:var(--theme)}
.fav{width:32px;height:32px;border-radius:8px;flex-shrink:0;background:#f0f1f3;display:flex;align-items:center;justify-content:center;overflow:hidden}
.fav img{width:100%;height:100%;object-fit:cover}
.fav .fb{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:700}
.info{min-width:0;flex:1}
.nm{font-size:13px;color:#444;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .2s}
.dm{font-size:11px;color:#aaa;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{text-align:center;padding:14px;border-top:1px solid #f0f1f3;cursor:pointer;color:var(--theme);font-size:14px;font-weight:500;transition:background .2s}
.more:hover{background:#fff5f6}
.state{text-align:center;padding:80px 20px;color:var(--muted);font-size:15px}
.foot{text-align:center;padding:40px 20px;color:#bbb;font-size:13px}
.totop{position:fixed;right:24px;bottom:32px;z-index:999;width:44px;height:44px;border-radius:50%;border:none;background:var(--theme);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(241,64,75,.4);opacity:0;transform:translateY(20px);pointer-events:none;transition:all .3s}
.totop.show{opacity:1;transform:translateY(0);pointer-events:auto}
.totop:hover{background:var(--theme-dark);transform:translateY(-2px)}
.mask{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px}
.mask.show{display:flex}
.modal{background:#fff;border-radius:16px;max-width:380px;width:100%;padding:36px 32px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.2);animation:pop .3s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{opacity:0;transform:scale(.85) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal .m-logo{width:64px;height:64px;margin:0 auto 16px;border-radius:50%;background:linear-gradient(135deg,#f1404b,#e91e63);display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;font-weight:800;font-style:italic}
.modal h2{font-size:20px;margin-bottom:10px}
.modal p{font-size:14px;color:#666;line-height:1.8}
.modal button{margin-top:20px;padding:10px 36px;border:none;border-radius:20px;background:var(--theme);color:#fff;font-size:14px;cursor:pointer;transition:background .2s}
.modal button:hover{background:var(--theme-dark)}
/* 详情页 */
.detail-view{display:none;max-width:var(--maxw);margin:0 auto;padding:calc(var(--nav-h) + 24px) 24px 60px}
.detail-view.show{display:block}
.breadcrumb{font-size:13px;color:#999;margin-bottom:20px}
.breadcrumb a{color:#666;cursor:pointer}
.breadcrumb a:hover{color:var(--theme)}
.detail-layout{display:grid;grid-template-columns:1fr 320px;gap:20px}
.detail-main{background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.detail-hero{background:linear-gradient(135deg,#f1404b,#e91e63);padding:40px 32px;color:#fff;display:flex;align-items:center;gap:24px}
.detail-hero .dh-fav{width:72px;height:72px;border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;box-shadow:0 4px 16px rgba(0,0,0,.15)}
.detail-hero .dh-fav img{width:44px;height:44px;object-fit:contain}
.detail-hero .dh-fav .fb{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:#fff}
.detail-hero h1{font-size:26px;margin-bottom:6px}
.detail-hero .dh-domain{font-size:14px;opacity:.85}
.detail-actions{display:flex;gap:12px;padding:24px 32px;border-bottom:1px solid #f5f6f8}
.btn-open{padding:12px 32px;border:none;border-radius:24px;background:var(--theme);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:all .25s;box-shadow:0 4px 14px rgba(241,64,75,.3)}
.btn-open:hover{background:var(--theme-dark);transform:translateY(-1px)}
.btn-back{padding:12px 28px;border:none;border-radius:24px;background:#f5f6f8;color:#555;font-size:14px;cursor:pointer;transition:all .25s}
.btn-back:hover{background:#e8e9eb}
.detail-info{padding:24px 32px}
.detail-info h3{font-size:16px;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.detail-info h3::before{content:"";width:4px;height:16px;background:var(--theme);border-radius:2px}
.info-row{display:flex;padding:12px 0;border-bottom:1px solid #f5f6f8;font-size:14px}
.info-row:last-child{border-bottom:none}
.info-row .lbl{width:80px;color:#999;flex-shrink:0}
.info-row .val{color:#333;word-break:break-all}
.detail-desc{padding:0 32px 28px;font-size:14px;color:#666;line-height:1.8}
.sidebar{display:flex;flex-direction:column;gap:16px}
.side-card{background:#fff;border-radius:var(--radius);padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.side-card h4{font-size:14px;margin-bottom:14px;display:flex;align-items:center;gap:6px;color:#333}
.side-card h4::before{content:"";width:3px;height:14px;background:var(--theme);border-radius:2px}
.rec-item{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;cursor:pointer;transition:background .2s}
.rec-item:hover{background:#f7f8fa}
.rec-item .fav{width:28px;height:28px;border-radius:6px}
.rec-item .nm{font-size:13px;color:#444;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
@media(max-width:768px){.menu{display:none}.hero{min-height:340px}.hero-title{font-size:24px;letter-spacing:5px}.hero-logo{width:80px;height:80px}.hero-logo span{font-size:32px}.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.searchbox input{height:52px;font-size:16px}.totop{right:16px;bottom:20px}.detail-layout{grid-template-columns:1fr}.sidebar{order:2}.detail-hero{flex-direction:column;text-align:center;padding:32px 20px}.detail-info{padding:20px}.detail-desc{padding:0 20px 20px}}
@media(max-width:480px){.grid{grid-template-columns:1fr 1fr}.blob-tr,.blob-bl{display:none}}
</style>
</head>
<body>
<header class="topnav" id="topnav">
  <div class="topnav-in">
    <div class="brand" onclick="goHome()">
      <div class="brand-badge">io</div>
      <span class="brand-name">我的导航</span>
    </div>
    <nav><ul class="menu">
      <li><button class="active" id="mHome" onclick="goHome()">首页</button></li>
      <li><button id="mCat" onclick="goCat()">分类</button></li>
      <li><button id="mAbout" onclick="showAbout()">关于</button></li>
    </ul></nav>
    <button class="icon-btn" onclick="focusSearch()" aria-label="搜索">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    </button>
  </div>
</header>

<!-- 首页视图 -->
<div id="homeView">
<section class="hero">
  <div class="blob blob-tl"></div>
  <div class="blob blob-tl2"></div>
  <div class="blob blob-tr"></div>
  <div class="blob blob-br"></div>
  <div class="blob blob-bl"></div>
  <div class="hero-in">
    <div class="hero-logo"><span>io</span></div>
    <div class="hero-title">ONE NAV</div>
    <div class="searchbox">
      <input type="text" id="si" placeholder="一导航，搜索你想去的网站..." autocomplete="off">
      <button class="go" onclick="doSearch()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      </button>
    </div>
    <div class="engines" id="engines">
      <button class="eng-btn active" data-e="baidu">百度</button>
      <button class="eng-btn" data-e="google">Google</button>
      <button class="eng-btn" data-e="bing">必应</button>
    </div>
  </div>
</section>
<nav class="catbar">
  <div class="catbar-in" id="catbar">
    <button class="cat active" data-cat="all">全部</button>
  </div>
</nav>
<main class="content" id="content">
  <div class="state">加载中...</div>
</main>
<footer class="foot">
  <p>我的导航 · 共 <span id="tc">0</span> 个书签</p>
</footer>
</div>

<!-- 详情视图 -->
<div class="detail-view" id="detailView">
  <div class="breadcrumb" id="crumb"></div>
  <div class="detail-layout">
    <div class="detail-main">
      <div class="detail-hero">
        <div class="dh-fav" id="dFav"></div>
        <div>
          <h1 id="dName"></h1>
          <div class="dh-domain" id="dDomain"></div>
        </div>
      </div>
      <div class="detail-actions">
        <button class="btn-open" id="dOpen" onclick="openSite()">访问网站</button>
        <button class="btn-back" onclick="goHome()">返回首页</button>
      </div>
      <div class="detail-info">
        <h3>网站信息</h3>
        <div class="info-row"><span class="lbl">网址</span><span class="val" id="dUrl"></span></div>
        <div class="info-row"><span class="lbl">域名</span><span class="val" id="dDomain2"></span></div>
        <div class="info-row"><span class="lbl">分类</span><span class="val" id="dCat"></span></div>
      </div>
      <div class="detail-desc" id="dDesc"></div>
    </div>
    <div class="sidebar">
      <div class="side-card">
        <h4>同分类推荐</h4>
        <div id="dRec"></div>
      </div>
    </div>
  </div>
</div>

<button class="totop" id="totop" onclick="goTop()" aria-label="返回顶部">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m18 15-6-6-6 6"/></svg>
</button>

<div class="mask" id="aboutMask" onclick="if(event.target===this)hideAbout()">
  <div class="modal">
    <div class="m-logo">io</div>
    <h2>我的导航</h2>
    <p>基于 Chrome 书签自动生成的个人网址导航</p>
    <p>共 <strong id="ac">0</strong> 个网站 · <strong id="an">0</strong> 个分类</p>
    <p style="color:#bbb;font-size:12px;margin-top:14px">OneNav Theme</p>
    <button onclick="hideAbout()">关闭</button>
  </div>
</div>

<script>
var CDN=['https://cdn.jsdelivr.net/gh/iosyyds/my-nav@main/src/app/bookmarks.ts','https://fastly.jsdelivr.net/gh/iosyyds/my-nav@main/src/app/bookmarks.ts','https://raw.githubusercontent.com/iosyyds/my-nav/main/src/app/bookmarks.ts'];
var G=[],cat='all',q='',eng='baidu',ps=36,sa={};
var E={baidu:'https://www.baidu.com/s?wd=',google:'https://www.google.com/search?q=',bing:'https://www.bing.com/search?q='};
var searchTimer=null,currentItem=null,allItems=[];

async function load(){
  for(var i=0;i<CDN.length;i++){
    try{
      var r=await fetch(CDN[i]);if(!r.ok)continue;
      var t=await r.text(),eq=t.indexOf('= [');if(eq<0)continue;
      var d=0,end=-1;
      for(var j=eq+2;j<t.length;j++){if(t[j]==='[')d++;if(t[j]===']'){d--;if(d===0){end=j;break}}}
      if(end<0)continue;
      G=new Function('return ['+t.slice(eq+3,end)+']')();
      allItems=[];
      G.forEach(function(g){g.items.forEach(function(it){it.catName=g.name;allItems.push(it)})});
      render();handleRoute();return;
    }catch(e){}
  }
  document.getElementById('content').innerHTML='<div class="state">数据加载失败，请刷新重试</div>';
}

var C=[['#f1404b','#e91e63'],['#ff9500','#ffb347'],['#e040fb','#c44dff'],['#007aff','#5ac8fa'],['#34c759','#30d158'],['#af52de','#ff2d55'],['#5856d6','#5e5ce6'],['#ff3b30','#ff6b6b']];
function hs(s){var h=0;for(var i=0;i<s.length;i++)h=s.charCodeAt(i)+((h<<5)-h);return Math.abs(h)}
function fh(d,n){var c=C[hs(d||n||'x')%C.length],l=(d||'?').charAt(0).toUpperCase();return '<div class="fav"><img src="https://'+d+'/favicon.ico" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'"><div class="fb" style="display:none;background:linear-gradient(135deg,'+c[0]+','+c[1]+')">'+l+'</div></div>'}
function bigFav(d,n){var c=C[hs(d||n||'x')%C.length],l=(d||'?').charAt(0).toUpperCase();return '<img src="https://'+d+'/favicon.ico" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'"><div class="fb" style="display:none;background:linear-gradient(135deg,'+c[0]+','+c[1]+')">'+l+'</div>'}

function gf(){var g=G;if(cat!=='all')g=g.filter(function(x){return x.name===cat});if(q)g=g.map(function(x){return{name:x.name,items:x.items.filter(function(it){return it.name.toLowerCase().indexOf(q)>-1||it.url.toLowerCase().indexOf(q)>-1||it.domain.toLowerCase().indexOf(q)>-1})}}).filter(function(x){return x.items.length>0});return g}

function render(){
  var bar=document.getElementById('catbar');
  var h='<button class="cat'+(cat==='all'?' active':'')+'" data-cat="all">全部</button>';
  G.forEach(function(g){var sn=g.name.split('/')[0].trim();h+='<button class="cat'+(cat===g.name?' active':'')+'" data-cat="'+g.name+'">'+sn+'</button>'});
  bar.innerHTML=h;
  bar.querySelectorAll('.cat').forEach(function(b){b.onclick=function(){cat=b.dataset.cat;sa={};render();scrollToContent()}});
  var g=gf(),t=0;g.forEach(function(x){t+=x.items.length});
  document.getElementById('tc').textContent=t;document.getElementById('ac').textContent=t;document.getElementById('an').textContent=g.length;
  var m=document.getElementById('content');
  if(!t){m.innerHTML='<div class="state">没有找到「'+(q||'')+'」相关的书签</div>';return}
  var o='';
  g.forEach(function(x){
    var shown=q?x.items.length:(sa[x.name]?x.items.length:Math.min(x.items.length,ps));
    o+='<div class="card"><div class="card-h"><h3>'+x.name+'</h3><span class="n">'+x.items.length+' 个网站</span></div><div class="card-b"><div class="grid">';
    x.items.slice(0,shown).forEach(function(it){
      var idx=allItems.indexOf(it);
      o+='<div class="item" onclick="location.hash=\'/detail/'+idx+'\'">'+fh(it.domain,it.name)+'<div class="info"><div class="nm" title="'+it.name+'">'+it.name+'</div><div class="dm">'+it.domain+'</div></div></div>';
    });
    o+='</div></div>';
    if(!q&&x.items.length>ps&&!sa[x.name])o+='<div class="more" data-g="'+x.name+'">展开更多 ('+(x.items.length-ps)+')</div>';
    o+='</div>';
  });
  m.innerHTML=o;
  m.querySelectorAll('.more').forEach(function(el){el.onclick=function(){var gname=el.dataset.g;var rect=el.getBoundingClientRect();var targetY=rect.top+window.scrollY-80;sa[gname]=true;render();window.scrollTo(0,targetY)}});
}

function goTop(){window.scrollTo({top:0,behavior:'smooth'})}
function goHome(){location.hash='/'}
function goCat(){scrollToContent();setNav('mCat')}
function scrollToContent(){var el=document.getElementById('content');if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}
function focusSearch(){goTop();setTimeout(function(){document.getElementById('si').focus()},400)}
function setNav(id){document.querySelectorAll('.menu button').forEach(function(b){b.classList.remove('active')});document.getElementById(id).classList.add('active')}
function showAbout(){document.getElementById('aboutMask').classList.add('show')}
function hideAbout(){document.getElementById('aboutMask').classList.remove('show')}

function openSite(){if(currentItem)window.open(currentItem.url,'_blank')}

function showDetail(idx){
  var it=allItems[idx];if(!it)return;
  currentItem=it;
  document.title=it.name+' - 我的导航';
  document.getElementById('homeView').style.display='none';
  document.getElementById('detailView').classList.add('show');
  document.getElementById('dFav').innerHTML=bigFav(it.domain,it.name);
  document.getElementById('dName').textContent=it.name;
  document.getElementById('dDomain').textContent=it.domain;
  document.getElementById('dUrl').textContent=it.url;
  document.getElementById('dDomain2').textContent=it.domain;
  document.getElementById('dCat').textContent=it.catName||'-';
  document.getElementById('dDesc').innerHTML='「'+it.name+'」是'+it.domain+'上的网站，已收录于「'+(it.catName||'未分类')+'」分类下。点击访问网站可在新窗口打开。';
  document.getElementById('crumb').innerHTML='<a onclick="goHome()">首页</a> / <a onclick="goHome()">'+(it.catName||'全部').split('/')[0]+'</a> / '+it.name;
  // 同分类推荐
  var recs=allItems.filter(function(x){return x.catName===it.catName&&x.url!==it.url}).slice(0,6);
  var rh='';
  recs.forEach(function(r){
    var ri=allItems.indexOf(r);
    rh+='<div class="rec-item" onclick="location.hash=\'/detail/'+ri+'\'">'+fh(r.domain,r.name)+'<span class="nm">'+r.name+'</span></div>';
  });
  document.getElementById('dRec').innerHTML=rh||'<p style="color:#999;font-size:13px;padding:8px">暂无相关推荐</p>';
  window.scrollTo(0,0);
}

function handleRoute(){
  var h=location.hash||'#/';
  if(h.indexOf('#/detail/')===0){
    var idx=parseInt(h.split('/').pop(),10);
    showDetail(idx);
  }else{
    document.title='我的导航';
    document.getElementById('detailView').classList.remove('show');
    document.getElementById('homeView').style.display='';
    window.scrollTo(0,0);
  }
}
window.addEventListener('hashchange',handleRoute);

function doSearch(){var v=document.getElementById('si').value.trim();if(!v){q='';sa={};render();return}q=v.toLowerCase();sa={};render()}
document.getElementById('si').addEventListener('input',function(e){clearTimeout(searchTimer);searchTimer=setTimeout(function(){q=e.target.value.trim().toLowerCase();if(G.length)render()},250)});
document.getElementById('si').addEventListener('keydown',function(e){if(e.key!=='Enter')return;var v=e.target.value.trim();if(!v)return;var m=false;G.forEach(function(g){g.items.forEach(function(it){if(it.name.toLowerCase().indexOf(v.toLowerCase())>-1)m=true})});if(!m)window.open(E[eng]+encodeURIComponent(v),'_blank')});
document.getElementById('engines').addEventListener('click',function(e){var b=e.target.closest('.eng-btn');if(!b)return;document.querySelectorAll('.eng-btn').forEach(function(x){x.classList.remove('active')});b.classList.add('active');eng=b.dataset.e});
window.addEventListener('scroll',function(){var sy=window.scrollY;document.getElementById('topnav').classList.toggle('scrolled',sy>10);if(document.getElementById('detailView').classList.contains('show'))return;setNav(sy<400?'mHome':'mCat');document.getElementById('totop').classList.toggle('show',sy>500)});
load();
</script>
</body>
</html>
