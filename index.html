<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的导航</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23f1404b'/><text x='50' y='68' font-size='50' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>N</text></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--theme:#f1404b;--theme-rgb:241,64,75;--hover:#d12768;--main:#484b4f;--muted:#93959a;--muted3:#a5a8aa;--bg:#f2f4f7;--card:#fff;--radius:12px;--radius-lg:16px;--blur:rgba(245,245,245,.75);--shadow:0 5px 15px -5px rgba(0,0,0,.1)}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--main);min-height:100vh;-webkit-font-smoothing:antialiased;padding-top:80px}
a{text-decoration:none;color:var(--main);transition:.3s}
a:hover{color:var(--theme)}
.navbar{position:fixed;top:0;left:0;right:0;height:80px;z-index:109;padding:10px;background:var(--blur);-webkit-backdrop-filter:saturate(2) blur(15px);backdrop-filter:saturate(2) blur(15px)}
.nav-inner{max-width:1260px;margin:0 auto;display:flex;align-items:center;gap:20px;height:100%}
.logo{font-size:20px;font-weight:800;color:var(--theme);white-space:nowrap;display:flex;align-items:center;gap:8px}
.logo-icon{width:32px;height:32px;border-radius:8px;background:var(--theme);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:800}
.search-wrap{flex:1;max-width:600px;display:flex;align-items:center;background:#fff;border-radius:25px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.search-wrap input{flex:1;border:none;outline:none;padding:11px 20px;font-size:14px;background:transparent}
.search-wrap button{border:none;background:var(--theme);color:#fff;padding:11px 22px;font-size:14px;font-weight:600;cursor:pointer;transition:.2s}
.search-wrap button:hover{background:var(--hover)}
.engines{display:flex;gap:0}
.engine-btn{padding:8px 14px;font-size:13px;cursor:pointer;border:none;background:transparent;color:var(--muted);border-radius:20px;transition:.2s}
.engine-btn.active{background:var(--theme);color:#fff}
.engine-btn:hover:not(.active){color:var(--theme)}
.container{max-width:1260px;margin:0 auto;padding:0 15px}
.hero{text-align:center;padding:30px 0 20px}
.hero h1{font-size:26px;font-weight:800;margin-bottom:6px}
.hero h1 span{color:var(--theme)}
.hero p{color:var(--muted);font-size:14px}
.cat-section{background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.cat-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 8px}
.cat-title{font-size:16px;font-weight:700;display:flex;align-items:center;gap:10px}
.cat-title .cat-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:800}
.cat-count{font-size:13px;color:var(--muted)}
.site-grid{padding:8px 16px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px}
.site-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;transition:.25s;cursor:pointer}
.site-item:hover{background:#f7f8fa;transform:translateY(-2px)}
.site-favicon{width:36px;height:36px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#f0f1f3}
.site-favicon img{width:100%;height:100%;object-fit:contain}
.site-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:800}
.site-info{min-width:0;flex:1}
.site-name{font-size:13px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.site-domain{font-size:11px;color:var(--muted3);margin-top:1px}
.site-name mark{background:rgba(var(--theme-rgb),.12);color:var(--theme);border-radius:2px;padding:0 2px}
.load-more{text-align:center;padding:14px;border-top:1px solid #f0f1f3;cursor:pointer;color:var(--theme);font-size:14px;font-weight:600;transition:.2s}
.load-more:hover{background:#fff5f6}
.empty{text-align:center;padding:60px;color:var(--muted)}
.footer{text-align:center;padding:30px;color:var(--muted3);font-size:12px}
@media(max-width:768px){.nav-inner{gap:10px}.logo span{display:none}.engines{display:none}.site-grid{grid-template-columns:1fr}.hero h1{font-size:22px}}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner">
<div class="logo"><div class="logo-icon">N</div><span>我的导航</span></div>
<div class="search-wrap"><input id="searchInput" placeholder="搜索书签或网址…"><button onclick="doSearch()">搜索</button></div>
<div class="engines"><button class="engine-btn active" data-e="baidu">百度</button><button class="engine-btn" data-e="google">Google</button><button class="engine-btn" data-e="bing">必应</button></div>
</div></nav>
<div class="container">
<div class="hero"><h1>我的<span>网址导航</span></h1><p>高效上网，从这里开始</p></div>
<div id="sections"><div class="empty">加载中…</div></div>
</div>
<div class="footer" id="footer"></div>
<script>
var PALETTES=[["#f1404b","#ff6b6b"],["#ff9500","#ffcc00"],["#34c759","#30d158"],["#007aff","#5ac8fa"],["#af52de","#ff2d55"],["#5856d6","#5e5ce6"],["#00c7be","#64d2ff"],["#8e8e93","#aeaeb2"]];
var CAT_STYLE={"开发 / 站长":{color:"#007aff",icon:"开"},"iOS / 苹果":{color:"#ff2d55",icon:"苹"},"设计 / 素材":{color:"#ff9500",icon:"设"},"机场 / 网络":{color:"#34c759",icon:"网"},"其他":{color:"#8e8e93",icon:"他"},"网盘 / 资源":{color:"#00c7be",icon:"盘"},"AI 工具":{color:"#af52de",icon:"AI"},"游戏":{color:"#ff3b30",icon:"游"}};
var ENGINES={baidu:"https://www.baidu.com/s?wd=",google:"https://www.google.com/search?q=",bing:"https://www.bing.com/search?q="};
var PAGE_SIZE=24;
var GROUPS=null,currentEngine="baidu",searchQuery="";
var pageState={};
function hashStr(s){var h=0;for(var i=0;i<s.length;i++)h=((h<<5)-h+s.charCodeAt(i))|0;return Math.abs(h)}
function faviconHTML(domain){var h=hashStr(domain);var p=PALETTES[h%PALETTES.length];var letter=domain.charAt(0).toUpperCase();return '<div class="site-favicon"><img src="https://'+domain+'/favicon.ico" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'"><div class="site-fallback" style="display:none;background:linear-gradient(135deg,'+p[0]+','+p[1]+')">'+letter+'</div></div>'}
function highlight(text,q){if(!q)return text;var idx=text.toLowerCase().indexOf(q.toLowerCase());if(idx===-1)return text;return text.slice(0,idx)+'<mark>'+text.slice(idx,idx+q.length)+'</mark>'+text.slice(idx+q.length)}
function getFilteredItems(g){if(!searchQuery)return g.items;var q=searchQuery.toLowerCase();return g.items.filter(function(i){return i.name.toLowerCase().indexOf(q)!==-1||i.domain.indexOf(q)!==-1||i.url.indexOf(q)!==-1})}
function render(){var container=document.getElementById("sections");var total=0;var html=GROUPS.map(function(g){var items=getFilteredItems(g);if(items.length===0)return '';total+=items.length;var style=CAT_STYLE[g.name]||{color:"#8e8e93",icon:"?"};var shown=pageState[g.name]||PAGE_SIZE;if(searchQuery)shown=items.length;var visible=items.slice(0,shown);return '<div class="cat-section"><div class="cat-head"><div class="cat-title"><div class="cat-icon" style="background:'+style.color+'">'+style.icon+'</div>'+g.name+'</div><div class="cat-count">'+items.length+' 个网站</div></div><div class="site-grid">'+visible.map(function(i){return '<a class="site-item" href="'+i.url+'" target="_blank" rel="noopener">'+faviconHTML(i.domain)+'<div class="site-info"><div class="site-name">'+highlight(i.name,searchQuery)+'</div><div class="site-domain">'+i.domain+'</div></div></a>'}).join('')+'</div>'+(items.length>shown?'<div class="load-more" onclick="loadMore(\''+g.name+'\')">加载更多 ('+(items.length-shown)+')</div>':'')+'</div>'}).join('');container.innerHTML=html||'<div class="empty">没有找到「'+searchQuery+'」</div>';document.getElementById("footer").textContent="共 "+total+" 个书签"}
function loadMore(name){pageState[name]=(pageState[name]||PAGE_SIZE)+PAGE_SIZE;render()}
function doSearch(){if(searchQuery)window.open(ENGINES[currentEngine]+encodeURIComponent(searchQuery),"_blank")}
function loadData(){var urls=['https://cdn.jsdelivr.net/gh/iosyyds/my-nav@main/src/app/bookmarks.ts','https://fastly.jsdelivr.net/gh/iosyyds/my-nav@main/src/app/bookmarks.ts','https://raw.githubusercontent.com/iosyyds/my-nav/main/src/app/bookmarks.ts'];function tryNext(i){if(i>=urls.length){document.getElementById("sections").innerHTML='<div class="empty">数据加载失败，请刷新重试</div>';return}fetch(urls[i]).then(function(r){return r.text()}).then(function(txt){var eqIdx=txt.indexOf('= [');if(eqIdx===-1)throw new Error('parse');var bracketStart=eqIdx+2;var depth=0,end=-1,inStr=false,strCh='';for(var j=bracketStart;j<txt.length;j++){var c=txt[j];if(inStr){if(c===strCh&&txt[j-1]!=='\\')inStr=false;continue}if(c==='"'||c==="'"||c==='`'){inStr=true;strCh=c;continue}if(c==='[')depth++;if(c===']'){depth--;if(depth===0){end=j;break}}}var arrStr=txt.slice(bracketStart,end+1);GROUPS=new Function('return '+arrStr)();render()}).catch(function(){tryNext(i+1)})}tryNext(0)}
document.getElementById("searchInput").addEventListener("input",function(e){searchQuery=e.target.value;if(GROUPS)render()});
document.getElementById("searchInput").addEventListener("keydown",function(e){if(e.key==="Enter")doSearch()});
document.querySelectorAll(".engine-btn").forEach(function(b){b.addEventListener("click",function(){document.querySelectorAll(".engine-btn").forEach(function(x){x.classList.remove("active")});b.classList.add("active");currentEngine=b.dataset.e})});
loadData();
</script>
</body>
</html>
